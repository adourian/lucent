name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  backend-build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    # ---------- Back-end ----------
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install backend deps
      run: |
        cd backend
        pip install -r requirements.txt

    - name: Run backend unit tests
      run: |
        cd backend
        pytest -q

  frontend-build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    # ---------- Front-end ----------
    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install and build
      run: |
        cd frontend
        npm ci --omit=optional
        npm run build
