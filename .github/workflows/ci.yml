name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# --------------------------------------------------------------------------
#                         Global environment values
# --------------------------------------------------------------------------
env:
  REGISTRY: docker.io
  IMAGE_NAMESPACE: ${{ secrets.DOCKERHUB_USERNAME }}

jobs:
# --------------------------------------------------------------------------
#                          Backend – tests + image
# --------------------------------------------------------------------------
  backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install backend deps
        run: |
          cd backend
          pip install -r requirements.txt
          pip install pytest pytest-asyncio respx

          pip install --upgrade --force-reinstall "fastapi>=0.95.0" "httpx>=0.23.0"

      - name: Run pytest
        run: |
          cd backend
          pytest -q

      # ---------- Build & push Docker image ----------
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build & push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/lucent-backend:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/lucent-backend:${{ github.sha }}

# --------------------------------------------------------------------------
#      Frontend – image
# --------------------------------------------------------------------------
  frontend:
    runs-on: ubuntu-latest
    needs: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ---------- Build & push Docker image ----------
      - name: Build & push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          # Pass production API URL into the Docker build
          build-args: |
            VITE_API_BASE=${{ vars.PROD_API_BASE }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/lucent-frontend:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/lucent-frontend:${{ github.sha }}
