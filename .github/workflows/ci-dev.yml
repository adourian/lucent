name: CI-Dev

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

env:
  REGISTRY: docker.io
  IMAGE_NAMESPACE: ${{ secrets.DOCKERHUB_USERNAME }}

jobs:
  backend-dev:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install backend deps
        run: |
          cd backend
          pip install -r requirements.txt
          pip install pytest pytest-asyncio respx

          pip install --upgrade --force-reinstall "fastapi>=0.95.0" "httpx>=0.23.0"

      - name: Run pytest
        run: |
          cd backend
          pytest -q

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push backend-dev image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/lucent-backend-dev:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/lucent-backend-dev:${{ github.sha }}

  frontend-dev:
    runs-on: ubuntu-latest
    needs: backend-dev

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Deps
        run: |
          cd frontend
          npm ci

      - name: Run Type Check
        # This runs the TypeScript compiler without emitting files.
        # It catches missing imports, unused vars, and type mismatches immediately.
        run: |
          cd frontend
          npx tsc --noEmit 

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push frontend-dev image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          build-args: |
            VITE_API_BASE=${{ vars.DEV_API_BASE }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/lucent-frontend-dev:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/lucent-frontend-dev:${{ github.sha }}
            