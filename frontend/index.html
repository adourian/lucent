<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Uses the new icon you pasted into vite.svg -->
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    
    <!-- Primary SEO Tags -->
    <title>Lucent | AI Clinical Trial Prediction Platform</title>
    <meta name="description" content="An open-source Clinical Intelligence Platform. Lucent fuses MedBERT, BioSimCSE, and all-MiniLM embeddings to forecast trial Probability of Success (PoS) with calibrated uncertainty estimation." />

    <!-- Open Graph / Social Media Tags -->
    <meta property="og:site_name" content="Lucent" />
    <meta property="og:title" content="Lucent | Clinical Trial Intelligence" />
    <meta property="og:description" content="An open-source Clinical Intelligence Platform. Lucent fuses MedBERT, BioSimCSE, and all-MiniLM embeddings to forecast trial Probability of Success (PoS) with calibrated uncertainty estimation." />
    <meta property="og:image" content="https://lucent-self.vercel.app/lucent-preview.jpg" />
    <meta property="og:url" content="https://lucent-self.vercel.app/" />
    <meta property="og:type" content="website" />

    <!-- Structured Data (JSON-LD) -->
    <!-- This explicitly tells Google to label the site "Lucent" instead of "Vercel" -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Lucent",
      "alternateName": ["Lucent Platform", "Lucent AI"],
      "url": "https://lucent-self.vercel.app/"
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
